{% extends "admin/change_list.html" %}
{% load static %}

{% block extrastyle %}
<link rel="stylesheet" href="{% static 'css/admin_custom.css' %}">
{% endblock %}

{% block content %}
<div class="countdown-bar">
  <div>
    <strong> 本月清空倒计时</strong>
    <span style="margin-left: 12px; opacity: 0.85;">外来车辆档案将在每月最后一天 23:59:59 自动清空</span>
  </div>
  <div class="countdown-timer" id="countdown-timer">计算中...</div>
</div>

{{ block.super }}

<script>
(function() {
  function getMonthEnd() {
    var now = new Date();
    return new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 59);
  }
  function pad(n) { return n < 10 ? '0' + n : n; }
  function updateCountdown() {
    var diff = Math.floor((getMonthEnd() - new Date()) / 1000);
    if (diff <= 0) {
      document.getElementById('countdown-timer').textContent = '已到期，请清空！';
      return;
    }
    var days = Math.floor(diff / 86400);
    var hours = Math.floor((diff % 86400) / 3600);
    var mins = Math.floor((diff % 3600) / 60);
    var secs = diff % 60;
    document.getElementById('countdown-timer').textContent =
      days + '天 ' + pad(hours) + ':' + pad(mins) + ':' + pad(secs);
  }
  updateCountdown();
  setInterval(updateCountdown, 1000);
})();
</script>
{% endblock %}
