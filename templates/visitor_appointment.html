<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>访客预约登记</title>
<style>
  :root { --blue: #3E6AE1; --carbon: #171A20; --graphite: #393C41; --pewter: #5C5E62; --silver: #8E8E8E; --ash: #F4F4F4; --white: #FFFFFF; --border: #E5E7EB; --radius: 4px; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--ash); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: var(--graphite); font-size: 14px; }
  .container { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 36px 32px; width: 100%; max-width: 420px; }
  .header { text-align: center; margin-bottom: 28px; }
  .header h1 { font-size: 20px; font-weight: 600; color: var(--carbon); margin-bottom: 4px; }
  .header p { font-size: 13px; color: var(--pewter); }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 11px; font-weight: 600; color: var(--pewter); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .form-group label .required { color: #DC2626; }
  .form-group input, .form-group textarea { width: 100%; padding: 8px 0; border: none; border-bottom: 1px solid var(--silver); font-size: 14px; font-family: inherit; color: var(--carbon); outline: none; transition: border-color 0.33s; background: transparent; }
  .form-group input:focus, .form-group textarea:focus { border-bottom-color: var(--blue); }
  .form-group input::placeholder, .form-group textarea::placeholder { color: var(--silver); }
  .form-row { display: flex; gap: 12px; }
  .form-row .form-group { flex: 1; }
  .btn { width: 100%; height: 40px; background: var(--blue); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; transition: background 0.33s; font-family: inherit; }
  .btn:hover { background: #3560C8; }
  .error-msg { background: #FEF2F2; color: #DC2626; padding: 10px 14px; border-radius: var(--radius); font-size: 13px; margin-bottom: 16px; }
  .success-box { text-align: center; padding: 40px 0; }
  .success-box .icon { font-size: 48px; margin-bottom: 16px; }
  .success-box h2 { font-size: 20px; font-weight: 600; color: #2E7D32; margin-bottom: 8px; }
  .success-box .detail { font-size: 13px; color: var(--pewter); line-height: 1.8; }
  .success-box a { display: inline-block; margin-top: 20px; padding: 8px 24px; border: 1px solid var(--blue); color: var(--blue); border-radius: var(--radius); text-decoration: none; font-size: 13px; transition: all 0.33s; }
  .success-box a:hover { background: var(--blue); color: #fff; }
  .footer-note { text-align: center; margin-top: 20px; font-size: 12px; color: var(--silver); }
</style>
</head>
<body>
<div class="container">
  {% if success %}
  <div class="success-box">
    <div class="icon">✅</div>
    <h2>预约提交成功</h2>
    <div class="detail">您的访客预约已提交，请等待管理员审批。<br>审批通过后方可进校。</div>
    <a href=".">继续预约</a>
  </div>
  {% else %}
  <div class="header"><h1>访客进校预约</h1><p>填写以下信息提交预约申请</p></div>
  {% if error %}<div class="error-msg">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="form-group"><label>访客姓名 <span class="required">*</span></label><input type="text" name="visitor_name" maxlength="50" placeholder="请输入您的姓名" required></div>
    <div class="form-group"><label>联系电话 <span class="required">*</span></label><input type="text" name="visitor_phone" maxlength="20" placeholder="请输入手机号码" required></div>
    <div class="form-group"><label>车牌号 <span class="required">*</span></label><input type="text" name="plate_number" maxlength="20" placeholder="请输入车牌号" required></div>
    <div class="form-group"><label>被访人 <span class="required">*</span></label><input type="text" name="host_name" maxlength="50" placeholder="请输入被访人姓名" required></div>
    <div class="form-group"><label>被访部门</label><input type="text" name="host_department" maxlength="100" placeholder="如：教务处、信息中心（选填）"></div>
    <div class="form-row">
      <div class="form-group"><label>预计进校日期 <span class="required">*</span></label><input type="date" name="expected_date" required></div>
      <div class="form-group"><label>预计时间</label><input type="time" name="expected_time" value="08:00"></div>
    </div>
    <div class="form-group"><label>进校事由 <span class="required">*</span></label><textarea name="purpose" rows="2" maxlength="500" placeholder="请简要说明进校事由" required></textarea></div>
    <button type="submit" class="btn">提交预约</button>
  </form>
  <div class="footer-note">提交后请等待管理员审批，审批通过后方可进校</div>
  {% endif %}
</div>
</body>
</html>
